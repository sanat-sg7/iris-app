name: CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-test-deploy:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run pytest
      run: pytest

    - name: Build Docker image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/iris-ml-api:latest .

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push Docker image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/iris-ml-api:latest

    - name: Pull Docker image
      run: docker pull ${{ secrets.DOCKER_USERNAME }}/iris-ml-api:latest

    - name: Run Docker container
      run: docker run -d -p 8000:8000 ${{ secrets.DOCKER_USERNAME }}/iris-ml-api:latest